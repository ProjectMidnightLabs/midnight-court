  <link rel="stylesheet" href="css/court.css" />
</head>
<body>
  <div id="age-gate">
    <h1>18+ // ENTER THE COURT</h1>
    <p>Adults only.</p>
    <div>
      <button class="gate-btn enter" type="button" onclick="enterCourt()">I am 18+ — open the doors</button>
      <button class="gate-btn leave" type="button" onclick="leaveCourt()">I'm out</button>
    </div>
  </div>
  <header>
    <a class="logo" href="index.html">MIDNIGHT <span>COURT</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="stories.html">Stories</a>
      <a href="rants.html">Talk Shit</a>

      <a href="journey.html">His Journey</a>
      <a href="gallery.html">Humiliation</a>
      <a class="active" href="challenges.html">Challenge Him</a>
    </nav>
  </header>
  <main>
    <h1>Issue a challenge</h1>
    <p class="lede">Women set the task. Cage rule applies if it counts as work.</p>
    <form id="chal-form" action="https://formsubmit.co/kyle89roberts@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="MIDNIGHT COURT — challenge" />
      <input type="hidden" name="_template" value="table" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="text" id="chal-from" name="issued_by" placeholder="Issued by (alias)" required />
      <input type="text" id="chal-title" name="title" placeholder="Challenge name" required />
      <textarea id="chal-body" name="challenge" placeholder="Rules. Proof. Deadline." required></textarea>
      <button type="submit" class="submit">Send him the order</button>
    </form>
    <h2>Active challenges</h2>
    <div id="chal-list"></div>
  </main>
  <footer>Project Liquid Midnight · <a href="gallery.html">Proof gallery</a></footer>
  <script src="js/court.js"></script>
</body>
</html>
